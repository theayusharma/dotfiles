# Dialogs
# windowrule = float on,size 1000 700, pin on, center on match:title ^(Open File)(.*)$
# windowrule = float on,size 1000 700, pin on, center on match:title ^(Select a File)(.*)$
# windowrule = float on,size 1000 700, pin on, center on match:title ^(Choose wallpaper)(.*)$
# windowrule = float on,size 1000 700, pin on, center on match:title ^(Open Folder)(.*)$
# windowrule = float on,size 1000 700, pin on, center on match:title ^(Save As)$
# windowrule = float on,size 1000 700, pin on, center on match:title ^(Library)(.*)$
# windowrule = float on,size 1000 700, pin on, center on match:title ^(File Upload)(.*)$
windowrule = float on, center on, size 1000 900, match:title ^(Save As|Open File|Select a File|Choose wallpaper|Open Folder|Library|File Upload).*$
# Pavucontrol floating
windowrule = float on, size 700 600, center on, pin on, match:class (.*org.pulseaudio.pavucontrol.*)

windowrule = float on, size 700 600, center on, pin on, match:class (.*blueman-manager.*)
# nm-connection-editor floating
windowrule = float on, size 700 600, center on, pin on, match:class (.*nm-connection-editor.*)

# Picture-in-Picture
# windowrule = keep_aspect_ratio on, move ((monitor_w*0.607)) ((monitor_h*0.606)), size (monitor_w*0.39), float on, pin on, match:title ^(Picture(-| )in(-| )[Pp]icture)$
#precisely calculated the bottom values, it took 20min due to new windowrule system and bad working of rule converter v53.0    :)
windowrule = float on, pin on, keep_aspect_ratio on, suppress_event maximize, size (monitor_w*0.35) (monitor_h*0.35),move (monitor_w*0.648) (monitor_h*0.647), match:title ^(Picture-in-Picture)$
#chromium based uses a diff spelling, works for helium
windowrule = float on, pin on, keep_aspect_ratio on, suppress_event maximize, size (monitor_w*0.35) (monitor_h*0.35),move (monitor_w*0.648) (monitor_h*0.647), match:title ^(Picture in picture)$

# Positioning: Right-bottom corner with 20px padding
# (monitor_w - window_w - 20) calculates the X position
# windowrulev2 = move (monitor_w-window_w-20) (monitor_h-window_h-20), initialTitle:^(Picture-in-Picture)$, initialClass:^(zen)$
#
# # Sizing: 30% of monitor width
# windowrulev2 = size 30%, initialTitle:^(Picture-in-Picture)$, initialClass:^(zen)$

# CRITICAL: Prevents Zen from overriding your rules
# windowrulev2 = suppressevent maximize, initialTitle:^(Picture-in-Picture)$, initialClass:^(zen)$
# System Mission Center
windowrule = float on, pin on, center on, size 900 600, match:class (io.missioncenter.MissionCenter)

# System Mission Center Preference Window
windowrule = float on, pin on, center on, match:class (missioncenter), match:title ^(Preferences)$

# float blueberry
# For Blueberry main window
windowrule = float on, center on, pin on, size 700 500, match:class ^(blueberry\.py)$
#nmgui-bin float
windowrule = float on, center on, pin on, size 700 500, match:class (com.network.manager)
# windowrulev2 = focus, class:^(blueberry\.py)$
# General floating
windowrule = float on, size 1000 700, center on, pin on, match:class (dotfiles-floating)

# No shadow for tiled windows
windowrule = no_shadow on, match:float 0


#kde connect cool things
windowrule = opacity 1, no_blur on, border_size 0, no_shadow on, no_anim on, no_focus on, suppress_event fullscreen, float on, pin on, match:title KDE Connect Daemon
# windowrule=minsize $your $resolution, title:KDE Connect Daemon
windowrule = min_size 1920 1080, match:title ^KDE Connect Daemon$
# windowrule=move 0 0, title:KDE Connect Daemon


windowrule = border_size 0, rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, rounding 0, match:float 0, match:workspace f[1]

#myengfix script
windowrule = float on, center on, size (monitor_w*0.6) (monitor_h*0.4), match:title ^(engfix)$



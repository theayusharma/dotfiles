# try android studio emulator

windowrule = float on, pin on, size 420 820, move (1459) (142), match:class ^(Emulator)$

# windowrulev2 = move 100%-w-40 50%-h/2,class:^(Emulator)$
#

# Emoji Picker Smile
windowrule = float on, pin on, move ((monitor_w*1)-window_w-40) (90), match:class (it.mijorus.smile)
#windowrulev2 = keepaspectratio, title:Gnome-control-center
windowrule = move ((monitor_w*0.5)) ((monitor_h*0.5)), size (monitor_w*0.6) (monitor_h*0.6), pin on, match:title Gnome-control-center
windowrule = float on, match:class (org.gnome.Settings)
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
